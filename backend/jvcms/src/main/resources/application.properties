# Application Name
spring.application.name=jvcms

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/jvcms_db
spring.datasource.username=jvcms_user
spring.datasource.password=jvcms_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA Configuration
# validate - ensures the database schema matches the entities, but relies on Flyway to create/update tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Log SQL statements (disabled for production performance)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
jwt.secret=${JWT_SECRET:please_change_this_secret_in_production_to_a_long_random_string_1234567890}
jwt.expiration=86400000

# Media Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads

# HTTP Response Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Java 21 Virtual Threads
spring.threads.virtual.enabled=true

# RFC 7807 Problem Details
spring.mvc.problemdetails.enabled=trueserver.forward-headers-strategy=native

# Setup Token for initial admin creation
cms.setup.token=${CMS_SETUP_TOKEN:}

